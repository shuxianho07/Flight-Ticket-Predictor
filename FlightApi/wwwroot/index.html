<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #F2EBE5;
            --card-bg: #FFFBF7;
            --text-main: #4A3B32;
            --text-sub: #8D7B68;
            --accent: #C08552;
            --button-bg: #5D4037;
            --button-text: #EFEBE9;
            --success: #556B2F;
            --warning: #D4A017;
            --danger: #A0522D;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .journal-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 10px 40px rgba(74, 59, 50, 0.1);
            border: 1px solid rgba(141, 123, 104, 0.2);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Lora', serif; font-size: 1.8rem; font-weight: 500; margin: 0; }
        .header p { font-family: 'Lora', serif; font-style: italic; font-size: 0.95rem; color: var(--text-sub); margin-top: 8px; }

        .input-group { margin-bottom: 20px; }
        .label-text { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: var(--text-sub); margin-bottom: 5px; }
        .row { display: flex; gap: 20px; }

        .cozy-input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid #D7CCC8;
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            color: var(--text-main);
            transition: 0.3s;
            border-radius: 0;
            box-sizing: border-box;
        }
        .cozy-input:focus { outline: none; border-bottom-color: var(--accent); background: linear-gradient(to bottom, transparent 95%, rgba(192, 133, 82, 0.1) 100%); }
        .cozy-input:disabled { color: var(--text-sub); border-bottom-style: dashed; cursor: not-allowed; }

        .btn-check {
            width: 100%;
            padding: 16px;
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-check:hover { background: #4E342E; transform: translateY(-1px); }

        /* --- RESULT SECTION --- */
        #result-area {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(141, 123, 104, 0.2);
            animation: fadeIn 0.6s ease;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .decision-badge {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .price-context {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        /* --- PRICE METER (Visual Gauge) --- */
        .meter-container {
            position: relative;
            height: 30px;
            margin: 20px 0 30px 0;
        }
        
        .meter-bar {
            position: absolute;
            top: 12px;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, var(--success) 0%, #D4E157 40%, var(--danger) 100%);
            border-radius: 3px;
            opacity: 0.7;
        }

        .meter-marker {
            position: absolute;
            top: 5px; /* Centers it over the bar */
            width: 4px;
            height: 20px;
            background: var(--text-main);
            border-radius: 2px;
            transform: translateX(-50%);
            transition: left 0.5s ease-out;
            z-index: 2;
        }
        
        .meter-label {
            position: absolute;
            top: -20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            transform: translateX(-50%);
            white-space: nowrap;
            transition: left 0.5s ease-out;
        }

        .meter-limits {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 22px;
        }

        /* Chart container */
        .chart-container {
            margin-top: 20px;
            height: 140px;
            width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="journal-container">
        <div class="header">
            <h1>Travel Log</h1>
            <p>Toronto ✈ Cancun</p>
        </div>

        <div class="row">
            <div class="input-group" style="flex:1">
                <label class="label-text">Origin</label>
                <select id="origin" class="cozy-input" disabled>
                    <option value="YYZ" selected>Toronto</option>
                </select>
            </div>
            <div class="input-group" style="flex:1">
                <label class="label-text">Dest</label>
                <input type="hidden" id="dest" value="2"> 
                <select class="cozy-input" disabled>
                    <option selected>Cancun</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-group" style="flex:1">
                <label class="label-text">Booking Date</label>
                <input type="date" id="bookingDate" class="cozy-input">
            </div>
            <div class="input-group" style="flex:1">
                <label class="label-text">Flight Date</label>
                <input type="date" id="flightDate" class="cozy-input">
            </div>
        </div>

        <div class="input-group">
            <label class="label-text">Price Observed ($)</label>
            <input type="number" id="price" class="cozy-input" placeholder="e.g. 450" value="450">
        </div>

        <button class="btn-check" onclick="predict()">Analyze Price</button>

        <div id="result-area">
            
            <div class="result-header">
                <div id="decision" class="decision-badge">--</div>
                <div id="confidence" class="price-context">Confidence: --%</div>
            </div>

            <div class="meter-container">
                <div class="meter-bar"></div>
                <div id="marker" class="meter-marker" style="left: 0%;"></div>
                <div id="markerLabel" class="meter-label" style="left: 0%;">$0</div>
                
                <div class="meter-limits">
                    <span>$300 (Great Deal)</span>
                    <span>$800 (Overpriced)</span>
                </div>
            </div>

            <div class="price-context" style="margin-bottom: 15px; font-style: italic;">
                "Based on historical data, the fair price for this month is roughly <strong id="fairPriceVal">$--</strong>."
            </div>

            <div class="chart-container">
                <canvas id="seasonChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('bookingDate').valueAsDate = new Date();
        
        // Data for Chart & Logic
        const monthLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const avgPrices = [465, 645, 380, 400, 500, 520, 650, 650, 500, 450, 400, 600];

        let myChart = null;

        function renderChart(highlightMonthIndex) {
            const ctx = document.getElementById('seasonChart').getContext('2d');
            const bgColors = avgPrices.map((_, i) => i === highlightMonthIndex ? '#C08552' : '#EAE0D5');

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        label: 'Avg Price',
                        data: avgPrices,
                        backgroundColor: bgColors,
                        borderRadius: 4,
                        barThickness: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { grid: { display: false }, ticks: { font: { family: 'Nunito', size: 9 } } }
                    }
                }
            });
        }

        async function predict() {
            const destType = document.getElementById('dest').value; 
            const bookingInput = document.getElementById('bookingDate').value;
            const flightInput = document.getElementById('flightDate').value;
            const price = parseFloat(document.getElementById('price').value);

            if (!flightInput || !bookingInput) return;

            const start = new Date(bookingInput);
            const end = new Date(flightInput);
            const daysUntil = Math.ceil((end - start) / (1000 * 3600 * 24));
            const monthIndex = end.getMonth(); 
            const month = monthIndex + 1;

            if (daysUntil < 0) { alert("Future dates only!"); return; }

            // Get API Prediction
            const response = await fetch(`/predict?days=${daysUntil}&month=${month}&destType=${destType}&price=${price}`);
            const data = await response.json();

            // UI UPDATES
            const area = document.getElementById('result-area');
            const decisionEl = document.getElementById('decision');
            const confEl = document.getElementById('confidence');
            const fairPriceEl = document.getElementById('fairPriceVal');
            
            area.style.display = 'block';
            confEl.innerText = `Confidence: ${data.confidence}`;

            // 1. UPDATE DECISION TEXT
            if (data.decision.includes("BUY")) {
                decisionEl.innerText = "Buy Now";
                decisionEl.style.color = "var(--success)";
            } else {
                decisionEl.innerText = "Wait";
                decisionEl.style.color = "var(--danger)";
            }

            // 2. UPDATE FAIR PRICE TEXT
            const optimal = avgPrices[monthIndex];
            fairPriceEl.innerText = `$${optimal}`;

            // 3. UPDATE METER GAUGE
            // Scale: Min $300, Max $800
            const minScale = 300;
            const maxScale = 800;
            
            // Calculate percentage (clamped between 0% and 100%)
            let percent = ((price - minScale) / (maxScale - minScale)) * 100;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;

            const marker = document.getElementById('marker');
            const markerLabel = document.getElementById('markerLabel');

            marker.style.left = `${percent}%`;
            markerLabel.style.left = `${percent}%`;
            markerLabel.innerText = `$${price}`; // Show user's price on the marker

            // 4. RENDER CHART
            renderChart(monthIndex);
        }
    </script>
</body>
</html>
